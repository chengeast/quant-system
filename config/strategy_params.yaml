# ============================================================================
# 统计套利 MVP · 策略参数基准（阶段 2 冻结版）
# ----------------------------------------------------------------------------
# 来源：phase2-quant-debate.md（3 位金融专家少数服从多数裁决）
# 本文件是项目"重点回测/检验"的核心参数。改动必须走审计流程（见下方 audit）。
#
# 安全说明：
#   - 策略参数本身非"机密"，但属竞争敏感 + 决策留痕，用 SHA256 校验和防误改。
#   - 真正敏感的 APIKEY 放在 .env（不进本文件、不进 Git），见 .env.example。
#   - 实盘开关密钥单独管理，见 live_trading。
# ============================================================================

version: "1.0"
frozen_by: "phase2-quant-debate"
frozen_date: "2026-11-06"
owner: "quant_experts_A_B_C"

# ---- 周期参数（用户 2026-11-08 裁决：「1h 周期怎么能写死呢？这是一个周期参数。不能写死」）----
# 单一事实源：src/core/timeframe.py。本段只声明「默认周期 + 市场交易日历 + 防呆规则」；
# 所有派生量（bar 秒数 / bars_per_hour / bars_per_day / bars_per_year /
# annualize_factor / bar_ms / 最大可拉天数）一律由 interval + 交易日历计算，
# 代码与配置中禁止再散落 1h / 365×24 / 3_600_000 等尺度常数。
# 注意：interval 是「回测调用参数」而非全局常量 —— 第四轮 15m/30m 对照实验
# 就是在同一进程里对每个实验传不同 BacktestConfig(interval=...)。
timeframe:
  default_interval: "1h"           # 唯一声明点；代码侧 DEFAULT_INTERVAL 须与之相同（验收强制校验）
  hours_per_day: 24.0              # 加密 7×24；A 股填 4
  trading_days_per_year: 365.0     # 加密 365；A 股填 252
  annualize_factor: "sqrt(trading_days_per_year * hours_per_day * 3600 / interval_seconds)"
  reject_unknown_interval: true         # 未知周期报错，绝不静默回退 1h（旧 gate_client 的坑）
  reject_scale_constant_mismatch: true  # 手写 bars_per_hour/annualize_factor 与派生不符即报错
  validate_data_filename: true          # 数据文件名声明周期须与 interval/data_interval 一致
  native_intervals: ["1m", "5m", "15m", "30m", "1h"]   # Gate.io 现货实拉验证
  aggregated_intervals: ["4h", "1d"]                   # 由 1h 聚合，须显式 data_interval="1h"
  max_candles_per_request: 10000   # Gate.io 只保留最近 10000 根（实测 2026-11-08）
  lookback_safety: 0.95            # 默认拉取天数相对理论上限的安全余量

# ---- 币种对筛选（争议点1 多数裁决）----
pair_screening:
  correlation_min: 0.85        # corr≥0.85 初筛（B、C 收紧，A 的 0.7 被否）
  cointegration:
    primary: "engle_granger"
    cross_check: "johansen"    # 双校验防伪回归（A 保留）
    adf_p_max: 0.05
  liquidity:
    min_daily_volume_usd: 50000000   # 日成交≥$50M（C 独有，采纳）
    max_spread_bps: 5                  # 盘口价差≤5bp（C）
  # 半衰期区间：数据驱动（用户 2026-11-07 原则：以计算结果为准，不凭经验）
  # 410天1h深数据实算 10 币对半衰期分布：
  #   270(BTC/ETH) 310(ETH/SOL) 360(BTC/SOL) 392(XRP/DOGE)
  #   530(ETH/XRP) 583(BTC/XRP) 629(SOL/XRP) 932/1152/1416(含DOGE腿,离群)
  # 全量 IQR=[368,856]；DOGE 腿为离群（流动性弱/协整差），标记但不硬删区间边界
  half_life_bars: [368, 856]
  # 【数据血缘标注，非运行时周期常量】下面两个 1h 字样只说明该区间是
  # 410 天 1h 样本的测量结果；运行时周期一律取 timeframe.default_interval /
  # BacktestConfig(interval=...)。换周期时半衰期 bar 区间须按 bars_per_hour
  # 等比换算（见 src/signal_layer/pair_screener.py 的 hl_range 派生逻辑）。
  measured_on_interval: "1h"
  data_driven: true            # 区间由 M2 实算分布得出，非经验值
  outlier_legs: ["DOGE_USDT"]  # DOGE 腿半衰期932-1416bar 为离群，标注；币对优选排除

# ---- 选定币对（M2 深数据 410 天重筛结果，数据驱动）----
selected_pair:
  leg_a: "ETH_USDT"
  leg_b: "SOL_USDT"
  selected_from: "m2_screening_1h_410d"
  corr: 0.982
  eg_p: 0.0186
  half_life_bars_1h: 407.0    # 键名中的 1h 同为数据血缘标注（410 天 1h 样本测量值）
  note: "410天深数据重筛：EG_p 0.0186为最优协整，corr 0.982，半衰期407bar(17天)。"
        "旧BTC/SOL(EG_p 0.0648)在深数据下不达标，已由数据纠正。"

# ---- 信号（争议点2 多数裁决：±3σ / 0.5σ / 2σ止损 / 动态超时）----
signal:
  entry_sigma: 3.0             # ±3σ 进场（B、C 胜出，A 的 2.5σ 落选）
  exit_sigma: 0.5              # 0.5σ 离场（3:0 一致）
  stop_loss_sigma: 2.0        # 单腿 2σ 硬止损（C 值，B 的 1.5σ 过紧）
  timeout_hours: 3.0          # max(3h, 1.2H) 超时强平（C 值）
  timeout_half_life_factor: 1.2  # 超时 = max(3h, 1.2 × H)

# ---- 对冲比率 h（争议点3 多数裁决）----
hedge_ratio:
  estimation: "rolling_ols_return"   # 60bar 收益率 OLS（A 值）
  window_bars: 60
  range: [0.5, 2.0]                  # h∈[0.5,2.0]（A/C，B 的 1.5 落选但保留告警）
  daily_change_max: 0.10            # 日变化率<10%（A/C 值）
  invalidate_on_out_of_range: true   # 越界即整对 INVALID + 告警

# ---- 回测通过门槛（争议点4 多数裁决）----
backtest_gate:
  max_drawdown_pct: 10.0        # 回撤≤10%
  min_sharpe: 2.0               # 夏普≥2.0（扣 0.08% 成本后）
  min_calmar: 1.5               # Calmar≥1.5
  max_consecutive_losses: 5     # 最长连续亏损≤5 笔
  # 极端段门槛（数据窗口 2025-09~2026-11 不含 2024-09，按用户裁决改写为窗口内真实极端段）
  # 2026-02-04~02-10：7 日累计 -25.7%（02-05 单日 -14.0%），为窗口内最极端崩盘段
  must_survive_extreme_window: "2026-02"
  extreme_window_start: 1770163200   # 2026-02-04 00:00 UTC
  extreme_window_end: 1770681600     # 2026-02-10 00:00 UTC

# ---- 交易成本假设（吸纳 B、C，升级为硬门槛）----
cost_model:
  taker_fee_pct: 0.001          # Gate.io taker 0.1%
  slippage_bps_per_side: [3, 5]  # 滑点≥3–5bp/边
  max_cost_as_pct_of_gross: 0.35  # 每笔成本≤毛利 35%

# ---- 因子拥挤 / alpha 衰减监控（用户 2026-11-07 提出 + phase4 §9.2 修正）----
# 原则：衰减是渐进过程且被 AI 持续压缩，不可设固定重估周期，须"突变检测 + 滚动窗口"
# MVP 阶段仅落地接口与指标定义，数值待 M8 回测数据校准
monitoring:
  alpha_decay_monitor:
    slope_window: 60            # 滚动窗口 bar 数（非物理时长）：1h→60h、15m→15h；
                                # 需固定物理时长用 timeframe.bars_for_hours() 换算
    decay_ratio: 0.8           # 信号强度 vs 实现收益比，跌破 0.8 触发重估
    slippage_ratio_window: 30  # 价差回归速度观测窗口
    sigma_compression: 0.7     # 价差 σ 压缩阈值（σ 现值 / 历史 σ 中位数 < 0.7 触发）
    reestimate_trigger: "anomaly"  # 非固定周期，突变检测驱动
  crowding_metrics:            # 4 项拥挤度指标候选，M7 监控层实现
    - "signal_to_realized_ratio"
    - "price_diff_regression_speed"
    - "turnover_expansion"
    - "sigma_compression"
  backtest_steady_state_factor: 0.5   # 稳态收益 = 峰值收益 × 0.5（保守起步，M8 校准）

# ---- 年化口径（周期参数化后不再写死 1min / 1h 常数）----
# 旧值 "sqrt(252*144)" 是 1min A股口径的文档债，与加密 7×24 的 1h 实现不符，
# 且从未被代码读取。现值统一由 timeframe 段派生：annualize_factor = √bars_per_year。
annualization:
  sharpe_factor: "sqrt(bars_per_year)"   # 由 src/core/timeframe.py 按 interval 派生
  derived_from: "timeframe"

