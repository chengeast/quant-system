  - ts: "manual"
    actor: "manual"
    action: "checksum_refresh"
    reason: "参数变更流程留痕"
    checksum: "759f7c939a1e6b8a0eb6a407492835fbd9be34f1f7c9f4b75d26db5adcae85ef"
  - ts: "manual"
    actor: "manual"
    action: "checksum_refresh"
    reason: "参数变更流程留痕"
    checksum: "f6f6e0fbd492a030e31fe91d2b247a4acac3f3fd03104173d0b8807f002c9563"
live_trading:
  enabled: false               # 硬边界：MVP 默认关闭
  require_manual_approval: true
  require_second_confirmation: true
  second_confirmation_phrase: "CONFIRM LIVE TRADING"   # 翻转时须逐字输入
  key_vault: "SYSTEM_KEYVAULT"   # 系统级密钥管理，非文件存储
  key_reference: "LIVE_TRADING_KEY"
  key_independent_of_data_key: true   # 实盘密钥独立于数据密钥
  key_permissions: "order_only_no_withdraw"  # 最小权限：仅下单，禁用提现
  audit_retention_days: 90
